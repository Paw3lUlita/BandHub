spring.application.name=backend

# ===============================
# 1. DATABASE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/bandhub_db
spring.datasource.username=bandhub_user
spring.datasource.password=bandhub_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 2. JPA / HIBERNATE (ORM)
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# 3. FLYWAY (Migrations)
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# 4. SECURITY (Keycloak)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/bandhub-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/bandhub-realm/protocol/openid-connect/certs

# Konfiguracja klienta password-grant uzywanego przez backend do logowania mobilki.
# Mobilka wola /api/public/auth/login, a backend robi password grant na rzecz fana.
# Dzieki temu mobilka NIE rozmawia bezposrednio z Keycloakiem (omija problem CORS / Web Origins).
app.keycloak.issuer-uri=http://localhost:8081/realms/bandhub-realm
app.keycloak.public-client-id=bandhub-public-client

# ===============================
# 5. LOGGING & SERVER
# ===============================
server.port=8080
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG
logging.level.com.bandhub.zsi.cms=DEBUG

# ===============================
# 5a. HIKARI CONNECTION POOL
# ===============================
# Postgres w Dockerze zamyka idle-connections, Hikari musi probowac otworzyc nowe.
# Bez tych ustawien czesc requestow blokuje sie na ~30s probujac zwalidowac wygasle polaczenia.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# 6. FILE UPLOAD
# ===============================
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
